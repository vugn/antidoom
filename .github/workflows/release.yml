name: Release

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub release.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Refuse to publish a debug-signed build.
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build the APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS="--release --build-name=$VERSION --build-number=${{ github.run_number }}"
          flutter build apk $ARGS
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/antidoom-$GITHUB_REF_NAME.apk"
          flutter build apk $ARGS --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/antidoom-$GITHUB_REF_NAME-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/antidoom-$GITHUB_REF_NAME-armeabi-v7a.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download
            Most phones: **antidoom-${{ github.ref_name }}-arm64-v8a.apk** (smaller).
            Not sure? Take **antidoom-${{ github.ref_name }}.apk**, which runs on every phone.

            Play Protect may block APKs installed from a browser or chat app, because AntiDoom uses the
            Accessibility Service. Install with `adb install <file>.apk` instead, then in
            App info → ⋮ → Allow restricted settings before turning on Accessibility.
            Checksums are in `SHA256SUMS.txt`.

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
